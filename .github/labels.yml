# Label taxonomy for the Soroban Keeper Network Wave Program.
# Apply with a label-sync action (e.g. github-label-sync) or by hand.

# ── Difficulty (Wave Program) ──────────────────────────────────────────
- name: good-first-issue
  color: "7057ff"
  description: Small, scoped, newcomer-friendly — pick this if it's your first PR
- name: intermediate
  color: "0e8a16"
  description: Assumes familiarity with the codebase
- name: advanced
  color: "b60205"
  description: Phase 2 / design-heavy work for experienced contributors

# ── Area ───────────────────────────────────────────────────────────────
- name: contract
  color: "1d76db"
  description: keeper-registry Soroban contract
- name: keeper-bot
  color: "5319e7"
  description: Off-chain keeper bot
- name: docs
  color: "006b75"
  description: Documentation
- name: testing
  color: "fbca04"
  description: Tests, fuzzing, benchmarks
- name: tooling
  color: "c2e0c6"
  description: CI, scripts, developer experience
- name: ts-sdk
  color: "0052cc"
  description: TypeScript SDK (packages/sdk-ts)
- name: rust-sdk
  color: "0052cc"
  description: Rust SDK (rust-sdk/)
- name: indexer
  color: "5319e7"
  description: Event indexer and its TypeScript client
- name: observability
  color: "bfdadc"
  description: Metrics, logging, tracing, alerting and runbooks
- name: staking
  color: "1d76db"
  description: Keeper staking, slashing and disputes
- name: oracle
  color: "1d76db"
  description: Oracle-backed task conditions (epic E11)
- name: cli
  color: "c5def5"
  description: The skn command-line tool (epic E16)
- name: dashboard
  color: "f9d0c4"
  description: Web dashboard (epic E17)

# ── Type / status ──────────────────────────────────────────────────────
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: correctness
  color: "d93f0b"
  description: Behaviour does not match the specification
- name: performance
  color: "fef2c0"
  description: Speed, size or resource cost
- name: security
  color: "ee0701"
  description: Security-sensitive — handle with care
- name: needs-triage
  color: "ededed"
  description: Awaiting maintainer review
